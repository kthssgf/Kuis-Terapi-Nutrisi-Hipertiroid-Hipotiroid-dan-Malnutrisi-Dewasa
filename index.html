<h2>Kuis Terapi Nutrisi: Hipertiroid, Hipotiroid, dan Malnutrisi Dewasa</h2>
<div id="app"></div>
</div>
<script>
const Q=[
{t:"C1-C2",s:"Pada hipertiroid, masalah gizi utama pasien yang BB-nya turun meskipun makan banyak adalah...",o:["Defisit energi akibat peningkatan metabolisme basal dan pengeluaran energi","Kelebihan energi yang disimpan sebagai lemak","Malabsorpsi primer vitamin B12","Hiperglikemia akibat resistensi insulin","Defisiensi selenium sebagai penyebab utama"],w:["Kelebihan energi tidak sesuai dengan penurunan BB; pada hipertiroid pengeluaran energi yang meningkat lebih besar daripada asupan.","Malabsorpsi primer vitamin B12 bukan masalah utama yang dijelaskan dalam PPT untuk kasus ini.","Hiperglikemia akibat resistensi insulin tidak menjelaskan penurunan BB pada hipertiroid.","Defisiensi selenium tidak menjadi penyebab utama penurunan BB pada hipertiroid; masalah utamanya adalah hipermetabolisme."],e:"T3 dan T4 yang tinggi meningkatkan metabolisme basal dan pengeluaran energi. Lipolisis dan turnover protein ikut meningkat sehingga massa otot dapat berkurang, meskipun nafsu makan bisa meningkat. Asupan tetap kalah dari kebutuhan, sehingga terjadi defisit energi dan penurunan BB."},
{t:"C1-C2",s:"Pernyataan yang paling tepat mengenai iodium pada pasien hipertiroid adalah...",o:["Tidak dianjurkan menghilangkan seluruh sumber iodium secara rutin, dan suplemen iodium dosis tinggi perlu dihindari tanpa indikasi","Semua pasien hipertiroid wajib diet bebas iodium seumur hidup","Garam beryodium harus digantikan garam biasa pada semua pasien","Kelp dan suplemen thyroid support aman karena alami","Iodium obat dan iodium makanan memiliki efek yang sama"],w:["Diet bebas iodium seumur hidup bukan rekomendasi; PPT menyebutkan pembatasan ekstrem tidak diperlukan tanpa indikasi.","Mengganti garam beryodium secara rutin tidak dianjurkan; iodium adalah bahan baku sintesis hormon tiroid.","Kelp dan suplemen thyroid support dapat mengandung iodium sangat tinggi, sehingga tidak otomatis aman.","Dosis farmakologis iodium berbeda dari iodium makanan dan harus mengikuti protokol dokter."],e:"Iodium adalah bahan baku sintesis hormon tiroid sehingga tidak dianjurkan dihilangkan secara rutin. Yang perlu dihindari adalah dosis tinggi tanpa indikasi dan pengawasan, termasuk dari kelp atau suplemen thyroid support yang kandungannya bisa sangat tinggi."},
{t:"C1-C2",s:"Menurut ATA 2016 yang dikutip PPT, diet rendah iodium yang ketat...",o:["Tidak rutin diwajibkan sebelum terapi radioiodin pada penyakit Graves","Wajib dilakukan pada semua pasien Graves sebelum terapi apa pun","Harus dilanjutkan selama 1 tahun setelah radioiodin","Digunakan sebagai terapi utama hipertiroid menggantikan antitiroid","Hanya dianjurkan pada anak dengan hipertiroid"],w:["Diet ketat wajib pada semua pasien sebelum terapi tidak sesuai dengan panduan ATA 2016 yang dikutip PPT.","Durasi satu tahun setelah radioiodin tidak tercantum sebagai rekomendasi dalam PPT.","Diet rendah iodium bukan terapi utama hipertiroid; terapi penyebab tetap wajib dengan antitiroid, radioiodin, atau bedah.","Diet rendah iodium tidak dibatasi pada anak; rekomendasi ini tidak sesuai dengan panduan yang dibahas."],e:"Menurut ATA 2016 yang dikutip PPT, diet khusus rendah iodium tidak rutin diwajibkan pada terapi Graves, termasuk sebelum radioiodin. Diet ekstrem tidak menggantikan terapi penyebab, yang tetap menjadi prinsip utama."},
{t:"C1-C2",s:"Pada hipertiroid, perubahan tulang yang perlu diperhatikan dalam terapi nutrisi adalah...",o:["Turnover tulang meningkat, sehingga kalsium dan vitamin D perlu dipastikan cukup sesuai AKG","Tulang menjadi lebih padat, sehingga kalsium tidak diperlukan","Penurunan turnover tulang yang memerlukan suplemen kalsium tinggi rutin","Tidak ada hubungan antara hormon tiroid dan tulang","Defisiensi vitamin K sebagai satu-satunya masalah"],w:["Tulang yang menjadi lebih padat tidak sesuai dengan efek hormon tiroid berlebih yang mempercepat turnover tulang.","Penurunan turnover tulang tidak sesuai dengan hipertiroid; justru turnover yang meningkat menjadi masalah.","Tidak ada hubungan tulang dan tiroid bertentangan dengan PPT yang menyebut turnover tulang meningkat.","Defisiensi vitamin K bukan masalah utama yang dibahas PPT untuk tulang pada hipertiroid."],e:"Hormon tiroid berlebih mempercepat turnover tulang, sehingga risiko kehilangan massa tulang meningkat. Karena itu asupan kalsium dan vitamin D perlu dipastikan sesuai AKG, sementara suplemen dosis tinggi rutin tanpa indikasi dihindari."},
{t:"C1-C2",s:"Levotiroksin sebaiknya diminum dengan air putih pada kondisi perut kosong, dengan waktu ideal...",o:["60 menit sebelum sarapan","Bersamaan dengan sarapan dan kopi","Setelah makan siang","Bersamaan dengan suplemen kalsium dan zat besi","Setiap sore sebelum makan"],w:["Bersamaan dengan sarapan dan kopi mengganggu absorpsi levotiroksin, karena kopi dapat mengurangi penyerapan.","Setelah makan siang meningkatkan kemungkinan interaksi dengan makanan dan menurunkan absorpsi.","Bersamaan dengan kalsium dan zat besi mengurangi absorpsi, sehingga jaraknya perlu diatur sekitar empat jam.","Setiap sore sebelum makan tidak sesuai dengan waktu ideal yang dianjurkan PPT, yaitu perut kosong sebelum sarapan."],e:"Levotiroksin diminum dengan air putih pada perut kosong, idealnya 60 menit sebelum sarapan, atau sebelum tidur minimal 3 jam setelah makan malam. Konsistensi waktu minum lebih penting daripada larangan makanan berlebihan."},
{t:"C1-C2",s:"Kebiasaan yang paling mengganggu absorpsi levotiroksin dan perlu diatur jaraknya adalah...",o:["Minum kopi, susu, atau suplemen zat besi dan kalsium bersamaan dengan obat","Makan sayuran hijau dalam porsi normal","Minum air putih saat perut kosong","Berolahraga ringan setelah minum obat","Mengonsumsi buah segar setelah makan siang"],w:["Makan sayuran hijau dalam porsi normal tidak menjadi masalah utama absorpsi; sayuran cruciferous tidak dilarang.","Minum air putih saat perut kosong justru merupakan cara yang dianjurkan untuk minum levotiroksin.","Berolahraga ringan setelah minum obat tidak dibahas sebagai faktor utama gangguan absorpsi.","Buah segar setelah makan siang tidak menjadi faktor utama gangguan absorpsi levotiroksin yang dibahas PPT."],e:"Kopi, susu, zat besi, kalsium, antasida, kedelai, dan serat pekat dapat mengurangi absorpsi levotiroksin. Praktik konvensional memisahkan kalsium dan zat besi sekitar 4 jam dari levotiroksin, dan konsumsi kopi perlu dihindari saat minum obat."},
{t:"C1-C2",s:"Sikap yang tepat mengenai sayuran cruciferous (kubis, brokoli, sawi) pada pasien hipotiroid adalah...",o:["Tidak perlu dilarang; dalam porsi normal dengan asupan iodium cukup umumnya aman","Harus dihindari seluruhnya karena pasti mengganggu hormon tiroid","Boleh dikonsumsi hanya dalam bentuk ekstrak pekat","Harus dimakan mentah agar goitrogennya hilang","Hanya boleh dikonsumsi bila pasien tidak mengonsumsi levotiroksin"],w:["Harus dihindari seluruhnya tidak sesuai dengan PPT yang menyebut sayuran cruciferous dalam porsi normal umumnya aman.","Ekstrak pekat justru tidak dianjurkan; konsumsi berlebihan dari ekstrak perlu dihindari.","Dimakan mentah tidak dianjurkan sebagai cara mengurangi goitrogen; pemasakan wajar dapat menurunkan aktivitas sebagian goitrogen.","Pembatasan berdasarkan konsumsi levotiroksin tidak sesuai; interaksi dinilai secara individual."],e:"Sayuran cruciferous dalam porsi normal umumnya aman bila asupan iodium cukup, sehingga tidak perlu dilarang semuanya. Pemasakan wajar dapat menurunkan aktivitas sebagian goitrogen, dan interaksi dengan obat dinilai secara individual."},
{t:"C1-C2",s:"Kecukupan gizi iodium (AKG Indonesia) untuk dewasa umumnya adalah...",o:["150 µg per hari","50 µg per hari","500 µg per hari","1.000 µg per hari","300 µg per hari"],w:["50 µg per hari terlalu rendah dan tidak sesuai dengan AKG dewasa yang dibahas PPT.","500 µg per hari melampaui kebutuhan dan termasuk berisiko bila dikonsumsi berlebihan tanpa indikasi.","1.000 µg per hari jauh melampaui kebutuhan dan termasuk megadosis yang harus dihindari.","300 µg per hari tidak sesuai dengan AKG dewasa; kebutuhan ibu hamil adalah 150 µg ditambah 70 µg."],e:"AKG iodium dewasa di Indonesia umumnya 150 µg per hari. Ibu hamil memerlukan tambahan 70 µg dan ibu menyusui tambahan 140 µg. Kelebihan iodium dapat memperburuk penyakit tiroid autoimun, sehingga megadosis tanpa indikasi perlu dihindari."},
{t:"C1-C2",s:"Pada hipotiroid, kebutuhan energi dalam terapi nutrisi harus...",o:["Diindividualisasi dari antropometri, usia, aktivitas, dan kondisi klinis, karena tidak ada angka kkal khusus yang universal","Dibatasi sangat rendah kalori untuk mempercepat penurunan berat badan","Ditetapkan sama untuk semua pasien sebesar 1.000 kkal per hari","Ditiadakan sepenuhnya selama terapi levotiroksin","Ditentukan hanya dari kadar TSH"],w:["Diet sangat rendah kalori tidak dianjurkan pada hipotiroid dan termasuk hal yang harus dihindari menurut PPT.","Angka tetap 1.000 kkal per hari untuk semua pasien tidak sesuai prinsip individualisasi.","Meniadakan kebutuhan energi tidak sesuai dengan kebutuhan fisiologis pasien.","Kadar TSH tidak menentukan kebutuhan energi; TSH digunakan untuk memantau terapi hormon."],e:"Kebutuhan energi pada hipotiroid diindividualisasi berdasarkan antropometri, usia, aktivitas, dan kondisi klinis. Bila diperlukan penurunan berat badan, defisit energi moderat dapat diberikan setelah hormon dioptimalkan. Diet sangat rendah kalori dan klaim detoks tiroid perlu dihindari."},
{t:"C1-C2",s:"Konstipasi pada hipotiroid berhubungan dengan...",o:["Motilitas usus yang melambat akibat hipotiroid","Peningkatan transit usus akibat hormon tiroid berlebih","Defisiensi kalsium yang berat","Peningkatan kadar T3 dan T4 yang mempercepat pengeluaran feses","Kelebihan iodium yang memicu diare"],w:["Peningkatan transit usus adalah gambaran hipertiroid, bukan hipotiroid.","Defisiensi kalsium berat bukan penyebab utama konstipasi pada hipotiroid menurut PPT.","Peningkatan T3 dan T4 justru berkaitan dengan hipertiroid dan mempercepat transit usus, bukan konstipasi.","Kelebihan iodium memicu diare tidak sesuai dengan mekanisme konstipasi pada hipotiroid."],e:"Pada hipotiroid, motilitas usus melambat sehingga terjadi konstipasi. Hal ini termasuk dalam manifestasi klinis yang berkaitan dengan status gizi dan perlu diperhatikan dalam asesmen, bersama kelelahan dan intoleransi dingin."},
{t:"C1-C2",s:"Menurut kerangka GLIM, diagnosis malnutrisi pada dewasa memerlukan...",o:["Minimal satu kriteria fenotipik dan minimal satu kriteria etiologik","Albumin serum yang rendah saja","Satu kriteria fenotipik tanpa kriteria etiologik","Indeks massa tubuh normal dan asupan baik","Skrining dengan MUST sebagai diagnosis akhir"],w:["Albumin rendah bukan kriteria diagnostik GLIM menurut PPT.","Satu kriteria fenotipik saja tidak cukup; GLIM mensyaratkan satu fenotipik dan satu etiologik.","IMT normal tidak menyingkirkan malnutrisi; penurunan BB dan massa otot tetap perlu diperiksa.","MUST adalah alat skrining risiko, bukan diagnosis akhir menurut GLIM."],e:"Diagnosis malnutrisi menurut GLIM memerlukan minimal satu kriteria fenotipik (penurunan BB tidak disengaja, IMT rendah, atau massa otot berkurang) dan minimal satu kriteria etiologik (asupan atau absorpsi menurun, atau inflamasi dan beban penyakit). Derajat ditentukan oleh kriteria fenotipik."},
{t:"C1-C2",s:"Ambang penurunan berat badan tidak disengaja yang termasuk kriteria fenotipik GLIM dalam 6 bulan adalah...",o:["Lebih dari 5 persen","Lebih dari 1 persen","Lebih dari 15 persen","Lebih dari 20 persen","Lebih dari 2 persen"],w:["Penurunan lebih dari 1 persen terlalu kecil dan tidak mencapai ambang fenotipik GLIM.","Penurunan lebih dari 15 persen melampaui ambang awal dan tidak sesuai dengan ambang 5 persen dalam 6 bulan.","Penurunan lebih dari 20 persen merupakan ambang derajat berat untuk penurunan lebih dari 6 bulan, bukan ambang awal.","Penurunan lebih dari 2 persen terlalu kecil untuk memenuhi kriteria fenotipik."],e:"Penurunan BB tidak disengaja lebih dari 5 persen dalam 6 bulan atau lebih dari 10 persen dalam lebih dari 6 bulan termasuk kriteria fenotipik GLIM. Ambang ini digunakan untuk menentukan adanya kriteria fenotipik dan kemudian derajat keparahannya."},
{t:"C1-C2",s:"Pada pasien dewasa malnutrisi yang stabil, kisaran praktis awal kebutuhan energi menurut PPT adalah...",o:["25-30 kkal/kg BB per hari","10-15 kkal/kg BB per hari","40-50 kkal/kg BB per hari","60-70 kkal/kg BB per hari","100 kkal/kg BB per hari"],w:["10-15 kkal/kg BB per hari terlalu rendah untuk pasien dewasa stabil dan dapat menyebabkan defisit lebih lanjut.","40-50 kkal/kg BB per hari melampaui kisaran praktis awal dan dapat berisiko pada pasien yang berisiko refeeding.","60-70 kkal/kg BB per hari tidak sesuai dengan kisaran praktis dewasa stabil.","100 kkal/kg BB per hari tidak sesuai dengan kisaran praktis dan terlalu tinggi sebagai target awal."],e:"Pada pasien dewasa stabil, kisaran praktis awal adalah 25-30 kkal/kg BB per hari, lalu disesuaikan dengan usia, aktivitas, penyakit, dan respons. Perhitungan prediktif atau kalorimetri indirek dapat digunakan bila tersedia, dengan hati-hati pada pasien berisiko refeeding."},
{t:"C1-C2",s:"Rute nutrisi pertama yang dipilih pada pasien dewasa yang masih dapat menelan dan saluran cerna berfungsi adalah...",o:["Oral, dengan optimalisasi makan biasa, fortifikasi, dan ONS bila perlu","Parenteral total sejak awal","Enteral melalui sonde pada semua pasien","Dekstrosa intravena saja","Tidak memberi nutrisi sampai pasien sembuh"],w:["Parenteral total sejak awal tidak sesuai; parenteral dipertimbangkan bila saluran cerna tidak dapat digunakan.","Enteral melalui sonde pada semua pasien tidak diperlukan; sonde dipakai bila oral tidak mencukupi tetapi usus berfungsi.","Dekstrosa intravena saja tidak memenuhi kebutuhan energi dan protein serta bukan pilihan rute pertama.","Menunda nutrisi sampai pasien sembuh berbahaya dan bertentangan dengan tujuan terapi nutrisi."],e:"Algoritme rute menurut PPT mengutamakan oral bila aman menelan dan pencernaan berfungsi, dengan optimalisasi makan, fortifikasi, dan ONS bila diperlukan. Enteral dipilih bila oral tidak mencukupi tetapi usus berfungsi, dan parenteral bila saluran cerna tidak dapat digunakan atau enteral tidak adekuat."},
{t:"C1-C2",s:"Pemberian karbohidrat pada pasien berisiko refeeding syndrome memicu mekanisme...",o:["Peningkatan insulin yang memindahkan fosfat, kalium, dan magnesium ke dalam sel","Peningkatan glukagon yang mengeluarkan fosfat melalui ginjal","Penurunan insulin yang meningkatkan kadar fosfat serum","Pelepasan kalium dari sel ke sirkulasi","Peningkatan absorpsi natrium di usus halus"],w:["Peningkatan glukagon dan ekskresi fosfat melalui ginjal bukan mekanisme utama refeeding syndrome setelah karbohidrat diberikan.","Penurunan insulin tidak sesuai, karena karbohidrat justru meningkatkan insulin.","Pelepasan kalium dari sel ke sirkulasi bertentangan dengan mekanisme refeeding, di mana kalium masuk ke sel.","Absorpsi natrium di usus halus bukan mekanisme utama yang dijelaskan dalam PPT untuk refeeding syndrome."],e:"Pemberian karbohidrat meningkatkan insulin, yang mendorong fosfat, kalium, dan magnesium masuk ke dalam sel. Akibatnya kadar serum turun dan dapat menyebabkan aritmia, gangguan napas, dan kelemahan. Pada pasien berisiko, elektrolit perlu dinilai dan dikoreksi, dan tiamin diberikan sesuai protokol."},
{t:"C1-C2",s:"Alat skrining risiko malnutrisi yang paling tepat untuk lansia di komunitas menurut PPT adalah...",o:["MNA-SF","NRS-2002","MUST untuk rawat inap saja","Antropometri tanpa skrining","Kadar albumin serum"],w:["NRS-2002 digunakan terutama untuk skrining pada rawat inap, bukan untuk lansia di komunitas sebagai pilihan utama.","MUST digunakan untuk komunitas, tetapi PPT menyebutkan MNA-SF untuk lansia, sehingga pilihan MUST rawat inap tidak tepat.","Antropometri saja tanpa skrining tidak sesuai dengan alur yang dianjurkan dalam PPT.","Kadar albumin serum bukan kriteria diagnostik dan tidak termasuk alat skrining risiko."],e:"PPT menyebutkan NRS-2002 untuk rawat inap, MUST untuk komunitas, dan MNA-SF untuk lansia. Skrining dilakukan sejak awal pelayanan, dan hasil berisiko dilanjutkan dengan asesmen gizi komprehensif, termasuk penilaian GLIM."},
{t:"C3-C4",s:"Perempuan 28 tahun dengan BB 47 kg, TB 160 cm, sebelumnya 53 kg (turun 11,3 persen), berdebar, tremor, dan sering lapar. FT4 meningkat, TSH tersupresi, dan terapi medis sedang dimulai. Estimasi awal energi dan protein yang paling tepat sebagai titik awal adalah...",o:["Energi sekitar 1.410-1.645 kkal per hari dan protein sekitar 56-71 g per hari, dengan titrasi sesuai tren BB","Energi 800 kkal per hari dan protein 20 g per hari","Energi 3.000 kkal per hari dan protein 150 g per hari","Energi 1.000 kkal per hari tanpa protein tambahan","Energi 2.500 kkal per hari untuk semua aktivitas"],w:["Energi 800 kkal per hari terlalu rendah dan berisiko memperburuk penurunan BB serta massa otot pada hipertiroid.","Energi 3.000 kkal dan protein 150 g terlalu tinggi sebagai titik awal dan tidak sesuai dengan estimasi 30-35 kkal per kg BB.","Energi 1.000 kkal tanpa protein tambahan tidak sesuai dengan kebutuhan pasien yang katabolik dan kehilangan massa otot.","Energi 2.500 kkal per hari bukan estimasi dari berat pasien dan tidak sesuai dengan rentang 30-35 kkal per kg BB."],e:"Pada hipertiroid dengan BB turun, PPT memakai rentang praktis 30-35 kkal per kg BB per hari. Untuk BB 47 kg, ini setara 1.410-1.645 kkal per hari sebagai titik awal. Protein 1,2-1,5 g per kg BB per hari (56-71 g) dipertimbangkan untuk mempertahankan massa otot bila fungsi ginjal memungkinkan. Titrasi dilakukan menurut tren BB dan toleransi."},
{t:"C3-C4",s:"Pasien hipertiroid cepat kenyang dan sulit menghabiskan porsi utama, sementara BB masih turun. Strategi diet yang paling tepat menurut PPT adalah...",o:["Porsi kecil lebih sering dan gunakan selingan padat gizi, misalnya roti gandum dengan selai kacang atau susu","Menghentikan makan selingan agar pasien tidak cepat kenyang","Memberikan porsi besar sekali makan tanpa selingan","Membatasi karbohidrat dan protein secara ekstrem","Menambah kopi untuk meningkatkan nafsu makan"],w:["Menghentikan selingan justru menurunkan asupan total dan memperburuk defisit energi pada pasien dengan BB turun.","Porsi besar sekali makan tidak sesuai untuk pasien yang cepat kenyang; strategi yang dianjurkan adalah porsi kecil lebih sering.","Pembatasan karbohidrat dan protein ekstrem berbahaya karena pasien sudah katabolik dan kehilangan massa otot.","Kopi dapat memperberat palpitasi dan insomnia serta tidak dianjurkan sebagai cara meningkatkan nafsu makan."],e:"Pada pasien hipertiroid yang cepat kenyang, porsi kecil lebih sering dengan selingan padat gizi, seperti roti gandum dengan selai kacang atau susu, lebih efektif. Pembatasan ekstrem tidak dianjurkan karena pasien sudah berisiko kehilangan massa otot, dan konsumsi kopi perlu dibatasi bila memperberat palpitasi."},
{t:"C3-C4",s:"Pasien hipertiroid yang ingin mengonsumsi rumput laut kelp setiap hari dan suplemen thyroid support untuk menjaga 'kesehatan tiroid'. Respons yang paling tepat adalah...",o:["Menjelaskan bahwa kelp dan suplemen tersebut dapat mengandung iodium sangat tinggi dan sebaiknya tidak dikonsumsi tanpa resep dan pengawasan dokter","Menyarankan konsumsi setiap hari karena pasti aman dan alami","Menyarankan dosis dua kali lipat untuk mempercepat perbaikan","Menyarankan menghentikan seluruh sumber iodium dari makanan","Menyarankan diet bebas gluten sebagai pengganti"],w:["Konsumsi setiap hari karena dianggap alami tidak tepat; alami tidak berarti aman, dan kandungan iodium dapat sangat tinggi.","Dosis dua kali lipat berbahaya karena dapat memperburuk hipertiroid dan meningkatkan paparan iodium yang tidak terkontrol.","Menghentikan seluruh sumber iodium dari makanan tidak dianjurkan; iodium makanan tidak perlu dihilangkan secara rutin.","Diet bebas gluten tidak direkomendasikan rutin dan tidak relevan untuk menangani paparan iodium."],e:"Kelp dan suplemen thyroid support dapat mengandung iodium sangat tinggi dan bervariasi, sehingga tidak otomatis aman. Pasien perlu diedukasi untuk tidak mengonsumsinya tanpa resep dan pengawasan dokter, sambil tetap mengonsumsi iodium makanan yang wajar."},
{t:"C3-C4",s:"Pasien hipertiroid yang sudah mencapai eutiroid, tetapi BB naik terlalu cepat setelah diet diberikan. Langkah yang paling tepat adalah...",o:["Mengurangi surplus energi dan mengevaluasi kembali kebutuhan energi sesuai kondisi terbaru","Menambah porsi makan agar BB stabil","Menghentikan semua obat tiroid karena BB sudah naik","Memberikan suplemen protein tinggi tanpa penilaian","Mengganti semua makanan dengan cairan"],w:["Menambah porsi makan justru memperbesar surplus energi dan mempercepat kenaikan BB.","Menghentikan obat tiroid berbahaya dan tidak sesuai dengan prinsip bahwa terapi penyebab tetap wajib.","Suplemen protein tinggi tanpa penilaian tidak sesuai dengan prinsip individualisasi dan dapat membebani ginjal pada kondisi tertentu.","Mengganti makanan dengan cairan tidak sesuai dengan tujuan terapi nutrisi dan tidak mengevaluasi kebutuhan energi."],e:"Begitu pasien mencapai eutiroid, kebutuhan energi dapat berkurang. Bila BB naik terlalu cepat, surplus energi dikurangi dan resep diet dievaluasi ulang untuk mencegah kenaikan BB berlebih. Terapi tiroid tidak dihentikan hanya karena BB berubah."},
{t:"C3-C4",s:"Perempuan 38 tahun dengan hipotiroid primer mendapat levotiroksin rutin, tetapi setiap pagi diminum bersama kopi susu dan suplemen besi. TSH masih tinggi. Tindakan yang paling tepat adalah...",o:["Atur waktu minum levotiroksin dengan air putih saat perut kosong dan beri jeda dengan kopi, susu, serta suplemen besi, lalu evaluasi ulang TSH","Menambah dosis levotiroksin dua kali lipat tanpa memperbaiki cara minum","Menghentikan levotiroksin dan memberikan kopi setiap pagi","Mengganti levotiroksin dengan antitiroid","Menghentikan suplemen besi tanpa evaluasi kadar besi"],w:["Menambah dosis dua kali lipat tanpa memperbaiki cara minum berisiko menyebabkan kelebihan hormon sebelum absorpsi diperbaiki dan tidak menyelesaikan penyebab utama.","Menghentikan levotiroksin membiarkan hipotiroid memburuk; kopi juga mengganggu absorpsi.","Antitiroid tidak sesuai untuk hipotiroid dan justru memperburuk kondisi.","Menghentikan suplemen besi tanpa evaluasi kadar besi tidak tepat; yang diatur adalah jarak waktu minum, bukan penghentian tanpa dasar."],e:"Kopi, susu, dan suplemen besi dapat mengurangi absorpsi levotiroksin sehingga TSH tetap tinggi. Tindakan yang tepat adalah mengatur waktu minum dengan air putih saat perut kosong, memberi jeda dari makanan dan suplemen, menelaah dosis dan kepatuhan, lalu mengevaluasi ulang TSH setelah penyesuaian."},
{t:"C3-C4",s:"Perempuan hamil dengan hipotiroid yang mendapat levotiroksin dan pemantauan dokter. Kebutuhan yodium hariannya menurut AKG Indonesia adalah sekitar...",o:["220 µg per hari","150 µg per hari","290 µg per hari","500 µg per hari","70 µg per hari"],w:["150 µg per hari adalah kebutuhan dewasa umum, belum termasuk tambahan kehamilan.","290 µg per hari adalah angka kebutuhan ibu menyusui, bukan ibu hamil.","500 µg per hari melampaui kebutuhan dan termasuk megadosis yang perlu dihindari tanpa indikasi.","70 µg per hari hanya tambahan kehamilan, bukan total kebutuhan harian."],e:"AKG iodium dewasa 150 µg per hari dan ibu hamil mendapat tambahan 70 µg, sehingga total sekitar 220 µg per hari. Kebutuhan yodium meningkat pada kehamilan dan kontrol hormon sangat penting, sehingga koordinasi dengan dokter penanggung jawab diperlukan."},
{t:"C3-C4",s:"Pasien hipotiroid berusia 68 tahun dengan polifarmasi, penyakit jantung, dan risiko malnutrisi. Pertimbangan khusus dalam terapi nutrisinya adalah...",o:["Mempertimbangkan sarkopenia, risiko kardiovaskular, interaksi obat, dan risiko malnutrisi dalam menyusun rencana asupan","Mengabaikan protein karena fungsi jantung","Membatasi semua cairan secara ketat","Memberikan diet tinggi lemak jenuh untuk menambah energi","Mengganti levotiroksin dengan diet saja"],w:["Mengabaikan protein tidak sesuai, karena risiko sarkopenia dan malnutrisi pada lansia justru memerlukan kecukupan protein.","Pembatasan cairan ketat tidak diindikasikan secara umum dan perlu disesuaikan dengan kondisi jantung oleh tenaga medis.","Diet tinggi lemak jenuh berisiko meningkatkan LDL dan penyakit kardiovaskular, sehingga tidak tepat.","Terapi gizi bersifat suportif, bukan pengganti hormon; levotiroksin tetap terapi utama."],e:"Pada lansia dengan hipotiroid, perlu dipertimbangkan sarkopenia, penyakit jantung, polifarmasi, dan risiko malnutrisi. Asupan protein dan energi disesuaikan secara individual, dengan interaksi obat diperhatikan. Terapi gizi bersifat suportif dan tidak menggantikan levotiroksin."},
{t:"C3-C4",s:"Pasien hipotiroid minum levotiroksin bersamaan dengan sarapan berupa tahu dan tempe dalam jumlah banyak. Hal yang paling tepat dilakukan adalah...",o:["Mengatur jarak minum obat dengan makanan kedelai dan serat pekat, serta mengevaluasi TSH","Menghentikan konsumsi tahu dan tempe karena dilarang sepenuhnya","Menambah dosis levotiroksin untuk mengatasi gangguan absorpsi","Mengganti levotiroksin dengan suplemen kedelai","Mengonsumsi tahu bersamaan dengan obat agar absorpsi meningkat"],w:["Melarang tahu dan tempe sepenuhnya tidak sesuai, karena kedelai bukan pantangan mutlak dan cukup diatur jaraknya.","Menambah dosis tanpa mengatur waktu minum berisiko menyebabkan kelebihan hormon dan tidak mengatasi penyebab interaksi.","Mengganti obat dengan suplemen kedelai tidak tepat, karena levotiroksin tetap terapi utama.","Mengonsumsi kedelai bersamaan dengan obat justru dapat mengurangi absorpsi levotiroksin."],e:"Kedelai dan serat pekat dapat mengurangi absorpsi levotiroksin bila dikonsumsi bersamaan, tetapi bukan pantangan mutlak. Solusi praktisnya adalah mengatur jarak waktu minum obat dan makanan, lalu mengevaluasi TSH untuk memastikan terapi optimal."},
{t:"C3-C4",s:"Pasien hipotiroid meminta suplemen selenium dosis tinggi setiap hari karena yakin dapat menyembuhkan Hashimoto. Respons yang paling tepat menurut PPT adalah...",o:["Selenium dikoreksi bila ada defisiensi, sedangkan suplementasi dosis tinggi rutin tidak terbukti menyembuhkan hipotiroid","Selenium dosis tinggi harus diberikan rutin karena merupakan terapi utama","Selenium menggantikan levotiroksin","Selenium dihindari sepenuhnya karena menyebabkan hipotiroid","Selenium hanya penting untuk pasien hipertiroid"],w:["Selenium dosis tinggi rutin sebagai terapi utama tidak sesuai dengan PPT yang menyebut tidak menjadi terapi standar.","Selenium tidak menggantikan levotiroksin; terapi hormon tetap diperlukan untuk hipotiroid yang membutuhkan penggantian hormon.","Selenium tidak dihindari sepenuhnya; kebutuhan dipenuhi melalui diet beragam dan dikoreksi bila terdapat defisiensi.","Selenium penting untuk fungsi deiodinase pada hipotiroid maupun hipertiroid, sehingga tidak tepat dibatasi pada satu kondisi."],e:"Selenium berperan dalam deiodinase dan sistem antioksidan. Kebutuhan dipenuhi melalui diet yang beragam dan dikoreksi bila defisiensi ditemukan. Suplementasi dosis tinggi rutin tidak terbukti menyembuhkan hipotiroid, dan suplementasi rutin pada Hashimoto tanpa indikasi belum menjadi terapi standar."},
{t:"C3-C4",s:"Pria 60 tahun dengan kanker saluran cerna. BB awal 70 kg, saat ini 64 kg dalam 4 bulan (turun 8,6 persen). Asupan makan menurun selama 3 minggu. IMT saat ini 22 kg/m2. Diagnosis malnutrisi menurut GLIM dan derajatnya adalah...",o:["Malnutrisi, stadium 1 (sedang), karena fenotipik penurunan BB dan etiologik asupan menurun","Normal, karena IMT 22 kg/m2 berada dalam rentang normal","Malnutrisi stadium 2 (berat), karena penurunan BB lebih dari 5 persen","Tidak dapat ditentukan tanpa albumin serum","Sarkopenia tanpa malnutrisi"],w:["IMT normal tidak menyingkirkan malnutrisi; penurunan BB dan asupan tetap perlu diperhatikan menurut GLIM.","Derajat berat memerlukan penurunan BB lebih dari 10 persen dalam 6 bulan atau lebih dari 20 persen dalam lebih dari 6 bulan, sedangkan kasus ini 8,6 persen dalam 4 bulan.","Albumin serum bukan kriteria diagnostik GLIM sehingga tidak diperlukan untuk menentukan diagnosis.","Penurunan BB dan asupan menurun memenuhi kriteria GLIM, sehingga bukan hanya sarkopenia; sarkopenia dan malnutrisi juga tidak disamakan."],e:"Penurunan BB 8,6 persen dalam 4 bulan memenuhi kriteria fenotipik lebih dari 5 persen dalam 6 bulan. Asupan menurun selama 3 minggu memenuhi kriteria etiologik. Derajat sedang atau stadium 1 karena penurunan BB 5-10 persen dalam 6 bulan. Keparahan ditentukan kriteria fenotipik, bukan IMT atau albumin."},
{t:"C3-C4",s:"Pria 55 tahun dengan IMT 24 kg/m2 (normal), tetapi BB turun 12 persen dalam 6 bulan dan asupan kurang dari 50 persen kebutuhan selama lebih dari 1 minggu. Menurut GLIM, derajat malnutrisi yang paling tepat adalah...",o:["Stadium 2 (berat), karena penurunan BB lebih dari 10 persen dalam 6 bulan","Stadium 1 (sedang), karena IMT masih normal","Tidak malnutrisi, karena IMT normal","Stadium 2 (berat), karena asupan kurang dari 50 persen","Tidak dapat ditentukan tanpa pemeriksaan massa otot"],w:["Stadium 1 tidak sesuai, karena penurunan BB lebih dari 10 persen dalam 6 bulan termasuk derajat berat menurut GLIM.","IMT normal tidak menyingkirkan malnutrisi, sebagaimana ditekankan GLIM.","Asupan kurang dari 50 persen berkontribusi sebagai kriteria etiologik, tetapi derajat ditentukan oleh kriteria fenotipik, yaitu penurunan BB.","Massa otot dapat dinilai bila tersedia, tetapi penurunan BB sudah cukup untuk menentukan derajat berat."],e:"Penurunan BB lebih dari 10 persen dalam 6 bulan termasuk stadium 2 atau derajat berat menurut GLIM. Asupan kurang dari 50 persen lebih dari 1 minggu memenuhi kriteria etiologik. Keparahan ditentukan oleh kriteria fenotipik, sehingga IMT normal tidak mencegah diagnosis malnutrisi."},
{t:"C3-C4",s:"Pasien dewasa 45 tahun, stabil, BB aktual 60 kg, dapat menelan, fungsi usus baik, tanpa pembatasan ginjal, jantung, atau diabetes. Ilustrasi target energi dan protein awal menurut PPT adalah...",o:["Energi sekitar 1.800 kkal per hari dan protein sekitar 72-90 g per hari","Energi sekitar 1.000 kkal per hari dan protein sekitar 30 g per hari","Energi sekitar 3.000 kkal per hari dan protein sekitar 150 g per hari","Energi sekitar 600 kkal per hari dan protein sekitar 50 g per hari","Energi sekitar 2.500 kkal per hari tanpa perhitungan protein"],w:["Energi 1.000 kkal dan protein 30 g terlalu rendah untuk pasien stabil dan tidak sesuai dengan kisaran praktis.","Energi 3.000 kkal dan protein 150 g melampaui kisaran praktis untuk pasien stabil dengan BB 60 kg.","Energi 600 kkal per hari terlalu rendah dan berisiko memperburuk malnutrisi.","Perhitungan protein tetap diperlukan pada pasien dewasa berisiko, sehingga tanpa protein tidak sesuai."],e:"Pada pasien stabil, kisaran praktis energi 25-30 kkal per kg BB per hari. Untuk BB 60 kg, target ilustratif 60 x 30 = 1.800 kkal per hari. Protein 1,2-1,5 g per kg BB memberi 72-90 g per hari, dengan sumber seperti telur, ikan, ayam, tempe, dan tahu. Ini bukan resep universal dan harus disesuaikan."},
{t:"C3-C4",s:"Pasien stroke dengan disfagia berat, tetapi saluran cerna berfungsi baik dan oral tidak aman. Rute nutrisi yang paling tepat menurut PPT adalah...",o:["Enteral melalui sonde dengan memperhatikan keamanan aspirasi, posisi kepala, dan toleransi","Parenteral total karena pasien tidak dapat menelan","Oral dengan makanan biasa tanpa modifikasi","Dekstrosa intravena saja","Tidak memberi nutrisi sampai disfagia membaik"],w:["Parenteral total tidak dipilih bila saluran cerna masih berfungsi; parenteral dipertimbangkan bila saluran cerna tidak dapat digunakan.","Oral dengan makanan biasa berisiko aspirasi karena oral tidak aman pada kasus ini.","Dekstrosa intravena saja tidak memenuhi kebutuhan energi dan protein serta bukan rute yang tepat.","Menunda nutrisi sampai disfagia membaik berbahaya dan bertentangan dengan tujuan terapi nutrisi."],e:"Bila oral tidak aman tetapi usus berfungsi, nutrisi enteral melalui sonde menjadi pilihan sesuai algoritme PPT. Keamanan aspirasi, posisi kepala, toleransi, dan hidrasi perlu diperhatikan, serta asupan yang benar-benar masuk dievaluasi."},
{t:"C3-C4",s:"Pasien dewasa makan sedikit, tetapi saluran cerna masih berfungsi baik dan dapat menelan. Dokter mempertimbangkan nutrisi parenteral rutin. Sikap yang paling tepat menurut PPT adalah...",o:["Tidak memilih parenteral rutin hanya karena asupan sedikit; optimalkan oral, fortifikasi, ONS, atau enteral sesuai indikasi","Langsung memberikan nutrisi parenteral total","Menghentikan semua nutrisi","Memberikan parenteral tanpa akses vaskular","Memberikan dekstrosa saja selama tiga hari"],w:["Langsung parenteral total tidak sesuai, karena parenteral bukan pilihan rutin jika usus masih berfungsi.","Menghentikan semua nutrisi berbahaya dan bertentangan dengan tujuan terapi nutrisi.","Parenteral memerlukan akses vaskular dan pemantauan ketat, sehingga tidak boleh diberikan tanpa akses.","Dekstrosa saja tidak memenuhi kebutuhan energi dan protein serta tidak sesuai dengan prinsip rute nutrisi."],e:"Nutrisi parenteral dipikirkan bila usus tidak dapat difungsikan atau penyerapan sangat tidak memadai. Pada pasien dengan usus yang masih berfungsi, parenteral bukan pilihan rutin. Optimalisasi oral, fortifikasi, ONS, dan enteral dipertimbangkan lebih dahulu sesuai indikasi."},
{t:"C3-C4",s:"Pasien dewasa tidak makan selama 10 hari karena penyakit, dengan penurunan BB berat. Nutrisi akan dimulai. Tindakan pencegahan refeeding syndrome yang paling tepat adalah...",o:["Menilai dan mengoreksi elektrolit, memberikan tiamin sesuai protokol, dan memulai nutrisi secara bertahap dengan pemantauan ketat","Langsung memberikan target energi penuh sejak hari pertama","Menunda pemeriksaan elektrolit sampai pasien makan normal","Memberikan karbohidrat dosis tinggi untuk mempercepat pemulihan","Menghentikan tiamin agar tidak mengganggu metabolisme"],w:["Target energi penuh sejak hari pertama meningkatkan risiko refeeding syndrome pada pasien dengan asupan sangat rendah berkepanjangan.","Pemeriksaan elektrolit harus dilakukan sebelum dan selama nutrisi pada pasien berisiko, tidak ditunda.","Karbohidrat dosis tinggi memicu pergeseran fosfat, kalium, dan magnesium ke dalam sel, sehingga meningkatkan risiko.","Tiamin diperlukan pada pasien berisiko refeeding sesuai protokol, sehingga menghentikannya tidak tepat."],e:"Pasien dengan asupan sangat rendah berkepanjangan dan penurunan BB berat berisiko tinggi refeeding syndrome. Pencegahannya meliputi penilaian dan koreksi elektrolit, pemberian tiamin sesuai protokol, dan pemulaan nutrisi secara bertahap dengan pemantauan ketat."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>
